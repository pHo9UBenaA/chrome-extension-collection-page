blockExoticSubdeps: true
frozenLockfile: true
minimumReleaseAge: 10080
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
  - workerd
overrides:
  # GHSA-wq5f-xc86-pv6w: patched librsvg used by sharp.
  sharp: 0.35.5
  # GHSA-r4xh-jqrq-34v2: quadratic TOML parsing in smol-toml.
  smol-toml: 1.9.0
  # GHSA-2m5v-pch6-74hx and other advisories fixed in undici 7.30.1.
  undici: 7.30.1
savePrefix: ''
strictDepBuilds: true
trustPolicy: no-downgrade
