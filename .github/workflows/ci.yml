name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # Screenshot baselines use macOS system fonts, matching local verification.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Use the exact pnpm version pinned in package.json.
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency security settings
        run: pnpm run lint:security --reporter=github

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Check JavaScript, CSS and configuration
        run: pnpm run ci --reporter=github

      - name: Check Markdown, HTML and SVG formatting
        run: pnpm run format:check

      - name: Run browser tests
        run: pnpm run test:ci
